editor.addEventListener('beforeinput',e=>{

  e.preventDefault();

  if(!row)return;

  // Place a zero-width caret anchor after it. It is stripped from PDF text.

function updateVisualLineOffsets(){
 // Recompute from ORIGINAL top anchors. A CSS translate does not affect
 // scrollHeight, so previous transforms never accumulate measurement drift.
 const rows=[...editor.querySelectorAll(':scope > .rt-line')];
 let offset=0;
 for(const row of rows){
  row.style.transform='';
  const first=row.querySelector('.rt-run');
  const size=first?parseFloat(getComputedStyle(first).fontSize):12;
  const expected=Math.max(size*1.22,parseFloat(row.style.minHeight)||0);
  const actual=Math.max(row.scrollHeight,row.offsetHeight);
  row.style.transform=offset?`translateY(${offset.toFixed(2)}px)`:'';
  // Extra visual rows must shift following source lines, but not other blocks.
  offset+=Math.max(0,actual-expected);
  const brs=row.querySelectorAll('br').length;
  if(brs&&actual<=expected+2)offset+=brs*Math.max(size*1.3,12);
 }
}

let renderJob=Promise.resolve();
async function refresh(){
  closeEditor(true);
  const requestVersion=rev;
  const job=renderJob.then(async()=>{
    if(rendered && pdfBytes)return;
    const n=rev;updating=true;page.classList.add('spin');
    announce('Rendering PDF…');
    try{
      const r=await fetch('/api/render',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({blocks:changes,line_sources:lineSourceIds,graphics:moves,objects:objectMoves,frames:textFrameWidths})});
      const d=await r.json();
      if(!r.ok)throw new Error(d.error||'Export failed');
      if(rev!==n)return;
      pdfBytes=blobBytes(d.pdf);
      image.src=b64toURL(d.png,'image/png');rendered=true;
      announce('Ready · '+Object.keys(changes).length+' text blocks, '+Object.keys(objectMoves).length+' objects');
    }catch(e){pdfBytes=null;rendered=false;announce('Not saved: '+e.message);}
    finally{updating=false;page.classList.remove('spin');}
  });
  renderJob=job.catch(()=>{});
  await job;
  if(rev!==requestVersion && !rendered)return refresh();
}

  moves=structuredClone(state.graphics||{});objectMoves=structuredClone(state.objects||{});
  Object.keys(textFrameWidths).forEach(k=>delete textFrameWidths[k]);Object.assign(textFrameWidths,state.frames||{});

  }
  for(const el of layer.querySelectorAll('.object')){
    const o=objectRef[el.dataset.obj],v=objectMoves[o.id]||{dx:0,dy:0,sx:1,sy:1};
    el.style.transform=`translate(${v.dx*page.clientWidth/model.width}px,${v.dy*page.clientWidth/model.width}px)`;

};
